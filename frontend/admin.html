<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Creart</title>
    <!-- Google Fonts para una tipografía moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --surface: #FFFFFF;
            --text-main: #1F2937;
            --text-light: #6B7280;
            --border: #E5E7EB;
            --danger: #EF4444;
            --danger-hover: #DC2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Utilidades */
        .hidden {
            display: none !important;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            width: 100%;
        }

        /* Tipografía */
        h1,
        h2 {
            color: var(--text-main);
            margin-bottom: 1.5rem;
            word-break: break-word;
        }

        /* Botones */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            min-height: 44px;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-danger {
            background-color: var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-small {
            padding: 0.5rem 0.85rem;
            min-height: 38px;
            font-size: 0.85rem;
        }

        /* Formularios */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            min-height: 44px;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            transition: all 0.2s;
            font-size: 1rem; /* 16px to prevent iOS auto-zoom */
            background-color: #F9FAFB;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #FFF;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .form-actions .btn {
            flex: 1 1 140px;
        }

        /* Pantalla de Login */
        #login-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
        }

        .login-card {
            background: var(--surface);
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 420px;
        }

        .login-card h2 {
            text-align: center;
            color: var(--text-main);
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }

        /* Panel de Control */
        #admin-section {
            padding-top: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: var(--surface);
            padding: 1.5rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            gap: 1rem;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2rem;
            align-items: start;
        }

        .card {
            background: var(--surface);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
        }

        /* Tabla de Productos */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            padding-bottom: 0.5rem;
        }

        table {
            width: 100%;
            min-width: 580px;
            border-collapse: collapse;
            text-align: left;
        }

        th,
        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        th {
            background-color: #F9FAFB;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tbody tr {
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: #F9FAFB;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .alert {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
        }

        .alert-error {
            background-color: #FEF2F2;
            color: #991B1B;
            border: 1px solid #F87171;
        }

        /* Media Queries Responsivas */
        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem 0.75rem;
            }

            #admin-section {
                padding-top: 1rem;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 1.25rem 1rem;
                gap: 1rem;
                border-radius: 0.75rem;
            }

            .header h1 {
                font-size: 1.25rem;
            }

            .header #logout-btn {
                width: 100%;
            }

            .card {
                padding: 1.25rem 1rem;
                border-radius: 0.75rem;
            }

            .card h2 {
                font-size: 1.25rem;
                margin-bottom: 1rem;
            }

            .login-card {
                padding: 2rem 1.25rem;
                border-radius: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <!-- Sección de Login -->
    <div id="login-section">
        <div class="login-card">
            <h2>Acceso Administrativo</h2>
            <div id="login-error" class="alert alert-error hidden"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" required placeholder="admin@creart.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem; padding: 1rem;">Iniciar
                    Sesión</button>
            </form>
        </div>
    </div>

    <!-- Sección del Panel -->
    <div id="admin-section" class="container hidden">
        <header class="header">
            <h1>Gestión de Productos - Creart</h1>
            <button id="logout-btn" class="btn btn-danger">Cerrar Sesión</button>
        </header>

        <div class="dashboard-grid">
            <!-- Tabla de Productos -->
            <div class="card">
                <h2>Catálogo Actual</h2>
                <div class="table-responsive">
                    <table id="products-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Categoría</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Llenado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Formulario ABM -->
            <div class="card">
                <h2 id="form-title">Nuevo Producto</h2>
                <form id="product-form">
                    <input type="hidden" id="prod-id">

                    <div class="form-group">
                        <label for="prod-name">Nombre del Producto</label>
                        <input type="text" id="prod-name" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="prod-price">Precio</label>
                        <input type="number" id="prod-price" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="prod-category">Categoría</label>
                        <select id="prod-category" class="form-control" required>
                            <option value="">Seleccione...</option>
                            <option value="madera">Madera</option>
                            <option value="metal">Metal</option>
                            <option value="acrilico">Acrílico</option>
                            <option value="otros">Otros</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="prod-image">Imagen del Producto</label>
                        <input type="file" id="prod-image" class="form-control" accept="image/*">
                        <small id="image-current-info" class="hidden" style="display: block; margin-top: 0.5rem; color: var(--text-light); font-size: 0.8rem;"></small>
                    </div>

                    <div class="form-group">
                        <label for="prod-desc">Descripción</label>
                        <textarea id="prod-desc" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn">Guardar Producto</button>
                        <button type="button" id="cancel-edit-btn" class="btn hidden"
                            style="background-color: var(--text-light);">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script de Admin -->
    <script src="./js/admin.js"></script>
</body>

</html>
